<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hunger Games Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="defs"></div>
<div id="app">
  <header id="top"></header>
  <main id="main"><p class="empty">Loading the arena…</p></main>
  <div id="controls" hidden></div>
</div>
<aside id="panel" hidden aria-label="Side panel"></aside>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">This simulator needs JavaScript.</p></noscript>
<script src="app.js"></script>
</body>
</html>
